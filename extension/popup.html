<!DOCTYPE html>
<html>
  <head>
    <title>Universal Scraper</title>
    <style>
      body { font-family: sans-serif; padding: 10px; width: 400px; }
      button { padding: 8px 12px; cursor: pointer; margin-bottom: 8px; }
      pre { max-height: 400px; overflow: auto; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <button id="scrapeBtn">Scrape this page</button>
    <button id="copyBtn">Copy to Clipboard</button>
    <pre id="output"></pre>
    <script src="popup.js"></script>
  </body>
</html>
